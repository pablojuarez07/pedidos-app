       (load)="onImgLoad()"

<!-- Modal para ver la imagen grande -->
<div class="modal" *ngIf="mostrarImagen" (click)="cerrarImg()">
  <img [src]="producto.imagen_url" class="modal-img">
</div>

<!-- Formulario de edicion -->
<div class="modal" *ngIf="mostrarFormulario">
  <form class="edit-form" [formGroup]="edit_form()" (ngSubmit)="guardarCambios()">
    <h2>Editar producto</h2>

    <label class="label-input">
      Nombre:
      <input type="text" formControlName="nombre" placeholder="Nombre" />
    </label>
    <label class="label-input">
      Precio:
      <input type="number" formControlName="precio" placeholder="Precio" />
    </label>
    <label class="label-input">
      Stock:
      <input type="number" formControlName="stock" placeholder="Stock" />
    </label>
    <label class="label-input">
      Categoria:
    </label>

    <div class="custom-select edit-select"
     (click)="toggleEditSelect();  $event.stopPropagation()"
     [class.open]="isEditOpen">

      <div class="selected"
          [class.placeholder]="!editSelectedCategory">
        {{ editSelectedCategory || "Seleccionar Categoría" }}
      </div>

      <svg fill="none" stroke-width="1.5"
          stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="m19.5 8.25-7.5 7.5-7.5-7.5"></path>
      </svg>

      <div class="options" [class.open]="isEditOpen">
        <div class="option"
            *ngFor="let cat of categorias"
            (click)="selectEditCategory(cat); $event.stopPropagation()">
          {{ cat }}
        </div>
      </div>
    </div>

    <label class="label-input">
      Descripcion:
      <textarea
        formControlName="descripcion"
        placeholder="Descripción">
      </textarea>
    </label>

    <div class="form-buttons">
      <button type="submit">Guardar</button>
      <button type="button" (click)="cerrarFormulario()">Cancelar</button>
    </div>
  </form>
</div>


<app-product-info [producto]="producto" />
