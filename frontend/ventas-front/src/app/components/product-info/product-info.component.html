  <!-- Panel lateral -->
  <div class="info-panel" [class.open]="visible">

    <button class="close-btn" (click)="close()">✕</button>

    <div class="info-content">

      <img class="product-img" [src]="producto?.imagen_url">

      <h2>{{ producto?.nombre }}</h2>
      <p class="descripcion">{{ producto?.descripcion }}</p>
      <p class="precio">$ {{ producto?.precio }}</p>

      <form [formGroup]="form_pedido()" (ngSubmit)="realizarPedido()" class="form_pedido">
        <label>
          Nombre del comprador:
          <input type="text"
                placeholder="Tu nombre"
                formControlName="nombre_comprador">
        </label>
        <label>
          Teléfono (opcional):
          <input type="text"
                placeholder="Ej: 351 123 4567"
                formControlName="telefono">
        </label>
        <label>
          Cantidad:
          <input type="number"
                placeholder="0"
                formControlName="cantidad"
                [max]="producto?.stock"
                min="1">
        </label>

        <label>
          Tipo de pago:
          <div class="custom-select" (click)="toggleSelect()" [class.open]="isOpen">
            <div class="selected" [class.placeholder]="!selectedType">
              {{ selectedType || "Seleccionar Tipo de Pago" }}
            </div>

            <svg data-slot="icon" fill="none" stroke-width="1.5" 
                stroke="currentColor" viewBox="0 0 24 24" 
                xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"></path>
            </svg>

            <div class="options" [class.open]="isOpen">
              <div 
                class="option" 
                (click)="selectPago('efectivo')">
                Efectivo
              </div>
              <div 
                class="option" 
                (click)="selectPago('mercadopago')">
                Mercado Pago
              </div>
            </div>
          </div>
        </label>

        <p class="text-nro"> 
          Si preferis comunicate con la vendedora: 
          <span> 
            351 651-4735 
            <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="100" height="100" viewBox="0 0 48 48">
              <path fill="#fff" d="M4.868,43.303l2.694-9.835C5.9,30.59,5.026,27.324,5.027,23.979C5.032,13.514,13.548,5,24.014,5c5.079,0.002,9.845,1.979,13.43,5.566c3.584,3.588,5.558,8.356,5.556,13.428c-0.004,10.465-8.522,18.98-18.986,18.98c-0.001,0,0,0,0,0h-0.008c-3.177-0.001-6.3-0.798-9.073-2.311L4.868,43.303z"></path><path fill="#fff" d="M4.868,43.803c-0.132,0-0.26-0.052-0.355-0.148c-0.125-0.127-0.174-0.312-0.127-0.483l2.639-9.636c-1.636-2.906-2.499-6.206-2.497-9.556C4.532,13.238,13.273,4.5,24.014,4.5c5.21,0.002,10.105,2.031,13.784,5.713c3.679,3.683,5.704,8.577,5.702,13.781c-0.004,10.741-8.746,19.48-19.486,19.48c-3.189-0.001-6.344-0.788-9.144-2.277l-9.875,2.589C4.953,43.798,4.911,43.803,4.868,43.803z"></path><path fill="#cfd8dc" d="M24.014,5c5.079,0.002,9.845,1.979,13.43,5.566c3.584,3.588,5.558,8.356,5.556,13.428c-0.004,10.465-8.522,18.98-18.986,18.98h-0.008c-3.177-0.001-6.3-0.798-9.073-2.311L4.868,43.303l2.694-9.835C5.9,30.59,5.026,27.324,5.027,23.979C5.032,13.514,13.548,5,24.014,5 M24.014,42.974C24.014,42.974,24.014,42.974,24.014,42.974C24.014,42.974,24.014,42.974,24.014,42.974 M24.014,42.974C24.014,42.974,24.014,42.974,24.014,42.974C24.014,42.974,24.014,42.974,24.014,42.974 M24.014,4C24.014,4,24.014,4,24.014,4C12.998,4,4.032,12.962,4.027,23.979c-0.001,3.367,0.849,6.685,2.461,9.622l-2.585,9.439c-0.094,0.345,0.002,0.713,0.254,0.967c0.19,0.192,0.447,0.297,0.711,0.297c0.085,0,0.17-0.011,0.254-0.033l9.687-2.54c2.828,1.468,5.998,2.243,9.197,2.244c11.024,0,19.99-8.963,19.995-19.98c0.002-5.339-2.075-10.359-5.848-14.135C34.378,6.083,29.357,4.002,24.014,4L24.014,4z"></path><path fill="#40c351" d="M35.176,12.832c-2.98-2.982-6.941-4.625-11.157-4.626c-8.704,0-15.783,7.076-15.787,15.774c-0.001,2.981,0.833,5.883,2.413,8.396l0.376,0.597l-1.595,5.821l5.973-1.566l0.577,0.342c2.422,1.438,5.2,2.198,8.032,2.199h0.006c8.698,0,15.777-7.077,15.78-15.776C39.795,19.778,38.156,15.814,35.176,12.832z"></path><path fill="#fff" fill-rule="evenodd" d="M19.268,16.045c-0.355-0.79-0.729-0.806-1.             </svg>
          </span>
        </p>

        <div class="error" *ngIf="form_pedido().get('cantidad')?.errors?.['max']">
          Solo hay {{ producto?.stock }} unidades disponibles
        </div>

        <!-- MENSAJE DE ÉXITO -->
        <div class="success" *ngIf="pedidoExitoso">
          ✅ Pedido realizado con éxito
        </div>

        <!-- MENSAJE DE ERROR -->
        <div class="error2" *ngIf="errorPedido">
          {{ errorPedido }}
        </div>

        <button 
          class="btn-pedir"
          type="submit"
          [disabled]="producto?.stock === 0 || form_pedido().invalid || enviando">
          {{ enviando ? 'Enviando...' : 'Realizar pedido' }}
        </button>
      </form>
    </div>
  </div>
