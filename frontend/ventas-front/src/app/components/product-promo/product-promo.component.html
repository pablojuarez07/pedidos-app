<div class="carousel" *ngIf="productosLoop.length > 0">
  <div class="viewport"
      (touchstart)="onTouchStart($event)"
      (touchmove)="onTouchMove($event)"
      (touchend)="onTouchEnd()">
      
    <!-- Imagen de fondo -->
    <img class="bg-img" src="promo_img.jpg" alt="Promo" />
    
    <button class="btn left" (click)="prev()">‹</button>

    <div
      class="track"
      [style.transform]="transform"
      [style.transition]="transition"
      (transitionend)="onTransitionEnd()"
    >

      <div class="item" *ngFor="let producto of productosLoop">
        <div class="slide">
          <!-- Contenido -->
          <div class="slide-content">
            <img
              class="producto-img"
              [src]="producto.imagen_url"
              alt="{{ producto.nombre }}"
            />

            <div class="info">
              <h2>{{ producto.nombre }}</h2>
              <div class="precio">$ {{ producto.precio }}</div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <button class="btn right" (click)="next()">›</button>
  </div>
</div>
